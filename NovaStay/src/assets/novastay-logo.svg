<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="goldGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#FFD97A"/>
      <stop offset="100%" stop-color="#C49A2C"/>
    </linearGradient>
    <linearGradient id="stayGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0A2B3A"/>
      <stop offset="60%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#1FB6A8"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#0A192F" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="transparent"/>

  <!-- Decorative flourish -->
  <path d="M60 140 C150 20, 320 20, 420 140" fill="none" stroke="#F3E1B6" stroke-width="6" opacity="0.35" stroke-linecap="round"/>

  <!-- NovaStay text with gold gradient and subtle shadow -->
  <g filter="url(#softShadow)">
    <text x="50%" y="54%" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="64" letter-spacing="2" fill="url(#goldGrad)">
      Nova
      <tspan fill="#FFFFFF" stroke="#D4AF37" stroke-width="0.9" paint-order="stroke">Stay</tspan>
    </text>
  </g>

  <!-- Small accent line under 'Stay' -->
  <line x1="330" y1="120" x2="410" y2="120" stroke="#D4AF37" stroke-width="3" stroke-linecap="round" opacity="0.9"/>

</svg>